
name: GitHub Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: ["main"]
    paths-ignore:
      - "github-metrics.svg"

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}

          user: Anonymous-Chris
          template: classic

          config_timezone: America/Chicago
          config_display: large

          # Dashboard order
          config_order: base.header, base.activity, base.community, base.repositories, languages, topics, code, stars, lines, isocalendar, metadata
          
          # # Recent activity
          # plugin_activity: yes
          # plugin_activity_limit: 10
          # plugin_activity_days: 14
          # plugin_activity_timestamps: yes
          # plugin_activity_filter: issue, pr, release, fork, review, ref/create

          # # Coding habits
          # plugin_habits: yes
          # plugin_habits_from: 200
          # plugin_habits_days: 14
          # plugin_habits_facts: yes
          # plugin_habits_charts: yes
          # plugin_habits_charts_type: classic

          # Random code snippet
          plugin_code: yes
          plugin_code_languages: python, javascript, typescript
          plugin_code_load: 100

          # Recently starred repositories
          plugin_stars: yes
          plugin_stars_limit: 8

          # Lines of code
          plugin_lines: yes

          # Contribution calendar
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year

          # Languages
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_threshold: 0%
          plugin_languages_sections: most-used
          plugin_languages_details: percentage
          plugin_languages_colors: github

          # Topics
          plugin_topics: yes
