
name: GitHub Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}

          user: Anonymous-Chris
          template: classic
          config_order: base.header, habits, isocalendar, languages, topics, repositories, lines          
          config_timezone: America/Chicago
          config_display: large
          # Calendar
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          # Languages
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_threshold: 0%
          plugin_languages_sections: most-used
          plugin_languages_details: percentage
          plugin_languages_colors: github

          # Coding habits and activity
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          plugin_habits_charts_type: graph

          # Technologies and topics
          plugin_topics: yes

          # Website performance
          plugin_pagespeed: yes
          plugin_pagespeed_url: https://anonymous-chris.github.io/windowsportfolio/
          plugin_pagespeed_detailed: yes
